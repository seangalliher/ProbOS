# AD-1256 store inventory baseline: every module that creates a table
# and does not yet have a declaration. Frozen so a NEW undeclared
# store fails on day one while the pre-existing ones do not.
#
# Regenerate the row set with:
#   python scripts/check_store_registry.py --update-baseline
# A blank review.owner/rationale/review_by fails --check on purpose.
# Declaring a store means DELETING its row here in the same commit.
schema_version: 1
baseline_id: ad-1256-store-inventory-v1
tracking_issue: 1302
review:
  owner: AD-1256
  rationale: Every row is a module that creates a table and predates the store registry. AD-1256 (#1302) ships the declaration layer and seeds nine declarations; declaring the remaining stores requires reading each one's retention, lifecycle owner and backup disposition, which is per-store review work rather than a mechanical edit. Freezing them here buys the property the platform-maturity program asks for -- a NEW store fails on day one -- without demanding fifty reviewed declarations in one slice. The rows carry no per-row rationale because every row means the same thing; a field that is always the same sentence stops being read.
  review_by: This file is empty, or every remaining row has a declaration.

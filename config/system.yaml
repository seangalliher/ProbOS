browser_tool:
  enabled: true
  # AD-1052a/c Stage 1: the Captain WATCHES and DRIVES the agent's browser
  # through the HXI Browser Workstation. headless must be false so a real
  # viewport exists for the MJPEG stream and for normalized-coord input mapping.
  # streaming_enabled / input_forwarding_enabled are set at their canonical
  # positions further down this block — duplicate keys here would be silently
  # overridden by those (YAML last-key-wins).
  headless: false
  default_timeout_ms: 30000
  session_max_duration_seconds: 1800
  session_reaper_interval_seconds: 60
  # AD-1235 (2026-08-10): a bounded egress policy for the crew's browser.
  #
  # This was `null` — allow-all — and the AD-1153 warning said so at every
  # boot. BF-743 then closed the floor beneath it (loopback, private ranges,
  # file://, metadata hosts are refused whatever this says), but the floor
  # cannot stop a NAME that resolves to a private address, and it has no
  # opinion about the open internet. This list does.
  #
  # The rule used to choose entries: a site an agent needs to do the work the
  # Captain asks for, weighted toward authored content over user-submitted.
  # Prompt injection travels through page text, so every page an agent reads
  # is a page that can address it — which is the real reason to keep this
  # short rather than convenient. Suffix matching applies, so `github.com`
  # covers `docs.github.com`.
  #
  # When something is refused, the reason appears in the log as "not in
  # allowlist" with the host. Add it here rather than widening to null.
  domain_allowlist:
    # Source hosting and package registries
    - github.com
    - githubusercontent.com
    - gitlab.com
    - pypi.org
    - pythonhosted.org
    - npmjs.com
    - crates.io
    - nuget.org
    - rubygems.org
    - packagist.org
    # First-party language and platform documentation
    - python.org
    - docs.rs
    - readthedocs.io
    - readthedocs.org
    - developer.mozilla.org
    # learn.microsoft.com, not microsoft.com — the parent domain is mostly
    # marketing and sign-in pages, which is not what an agent needs.
    - learn.microsoft.com
    - go.dev            # covers pkg.go.dev by suffix
    - rust-lang.org
    - nodejs.org
    - typescriptlang.org
    - kubernetes.io
    - docker.com
    - postgresql.org
    - sqlite.org
    - nginx.org
    - w3.org
    - json-schema.org
    - iana.org
    # Agent and model ecosystem
    - modelcontextprotocol.io
    - docs.anthropic.com
    - platform.openai.com
    - huggingface.co
    # Reference — higher injection surface, kept because refusing them costs
    # the Captain real answers
    - wikipedia.org
    - arxiv.org
    - stackoverflow.com
    - stackexchange.com
  domain_denylist: []
  screenshot_max_width: 1024
  screenshot_max_height: 768
  require_confirmation_for_tier_3: true
  confirmation_timeout_seconds: 300
  default_min_interval_seconds: 1.0
  per_action_timeout_ms: {}
  tier_3_domain_patterns:
  - '*bank*'
  - '*paypal*'
  - '*stripe*'
  - '*chase*'
  - '*coinbase*'
  - '*checkout*'
  llm_classifier_enabled: false
  llm_classifier_tier: fast
  llm_classifier_max_per_hour: 60
  llm_classifier_cache_ttl_seconds: 300
  compute_use_max_consecutive_autonomous_actions: 5
  compute_use_max_per_session: 50
  streaming_enabled: true          # AD-1052a Stage 1: MJPEG watch stream
  streaming_fps: 4
  streaming_jpeg_quality: 60
  streaming_max_concurrent_viewers: 4
  input_forwarding_enabled: true   # AD-1052c Stage 1: the Captain drives the live page
  recording_enabled: false
  recording_dir: data/browser-sessions
  recording_retention_days: 7
  recording_reaper_interval_seconds: 3600
  recording_max_size_mb_per_session: 500
  credential_vault:
    enabled: false
    backend: file
    file_path: data/credential_vault.json
    max_credentials: 100
    require_https_for_fill: true
  action_dispatch_enabled: false
  action_dispatch_max_consecutive_autonomous: 5
  action_dispatch_max_per_dm_turn: 1

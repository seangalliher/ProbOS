mcp:
  enabled: true
  management_enabled: true   # AD-1015+: runtime MCP server CRUD + AD-1019 per-agent access surface
  agent_tools_enabled: true  # AD-1019c: MCP tools agent-callable (tier-gated invoke)
  request_timeout_seconds: 30.0
  # 2026-08-11: first real MCP server. Chosen to exercise the bridge with the
  # least possible risk -- streamable HTTP, publicly documented, and NO
  # AUTHENTICATION, so BF-745 (auth lost on restart) cannot apply to it.
  # CORRECTION 2026-08-14: this comment used to add "so nothing can leak".
  # That is false. No credential is held, but the ARGUMENTS of every tool call
  # still leave the ship -- what a crew agent asks is visible to the operator.
  # Registered here rather than through the CRUD API because config servers
  # register FIRST at boot and survive a fresh DB.
  #
  # Tools it exposes: doc search, fetch a full article, code-sample search.
  # If this works end to end, the MCP path is proven and AD-1236's install
  # rung has something real to reason about.
  servers:
    - type: http
      url: https://learn.microsoft.com/api/mcp
      # BF-750: names the store row, and so the id its grants are keyed by
      # (mcp:microsoft-learn). Set BEFORE first seed -- changing it later
      # creates a second row and orphans every grant issued against the first.
      name: microsoft-learn
    # 2026-08-14: microsoft-learn alone was a SOURCE MONOCULTURE. Asked to
    # research LangChain Deep Agents, Ezri opened with microsoft_docs_search
    # (twice, before any web search) and steered the queries toward Azure to
    # fit the only reliable tool she had -- then cited Microsoft docs for a
    # question about a non-Microsoft project. The fix is more surfaces, not a
    # prompt telling her to prefer better ones she does not have.
    #
    # All three are streamable HTTP, unauthenticated, and verified through the
    # PRODUCTION call path -- `MCPClient.list_tools()` with no preceding
    # `initialize()`, which is what `MCPWorkbench._enumerate_tools` does.
    # That distinction is load-bearing: huggingface.co answers a handshake-first
    # probe with 4 tools and the production path with HTTP 400, so it is NOT
    # registered here. Registering it would have added a server that contributes
    # nothing and logs a degrade warning on every enumeration.
    #
    # MEASURED COST, corrected 2026-08-14: an earlier version of this comment
    # claimed the offered tool block does not grow because only pulled adapters
    # join it. That was wrong -- `agentic_dispatch` calls
    # `preload_open_tools(limit=24)` every turn and auto-pulls every authorized
    # OPEN tool. With these grants that is ~10 dispatch ids and a ~13.4k-char
    # tool block per agentic turn, plus ~0.9s of sequential tools/list warmup.
    # Accepted deliberately: the Captain asked for more sources, and a tool the
    # agent cannot see is not a source.
    - type: http
      url: https://mcp.deepwiki.com/mcp
      # Indexed docs + Q&A for any public GitHub repo. The tool that would
      # have answered the question above from langchain-ai/deepagents itself.
      name: deepwiki
    - type: http
      url: https://mcp.context7.com/mcp
      # Version-pinned library/framework documentation.
      name: context7
    - type: http
      url: https://mcp.grep.app
      # Code search across public GitHub: how an API is actually called.
      name: grep-app

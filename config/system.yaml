security_infra:
  secrets_persistence_enabled: true
  secrets_store_filename: secrets.json
  egress_enabled: true
  egress_deny_by_default: true
  # BF-751 (2026-08-11): the allowlist had no operator surface, so the MCP
  # bridge -- which consults this policy unconditionally -- could never reach
  # any external server. Every host an MCP server is registered on must appear
  # here or its tools are invisible to the whole crew.
  egress_allowlist:
    - 127.0.0.1
    - localhost
    - ::1
    - learn.microsoft.com   # the Microsoft Learn MCP server
    # 2026-08-14: the hosts of the four MCP servers added below to end the
    # single-source monoculture. Each is a read-only documentation or code
    # search surface, reached unauthenticated, and is here because we chose to
    # register it -- not because the list was widened for convenience.
    # Unauthenticated is NOT the same as leak-proof: tool ARGUMENTS still leave
    # the vessel, so what a crew agent asks these servers is visible to them.
    # Accepted deliberately for public documentation lookups.
    - mcp.deepwiki.com      # deepwiki: GitHub repo docs + Q&A
    - mcp.context7.com      # context7: version-pinned library docs
    - mcp.grep.app          # grep-app: code search across public GitHub
    # The web_search backends. Inert while egress_active_enforcement is false,
    # but without them turning that flag on would silently kill search --
    # exactly the BF-751 failure recorded above, one surface over.
    - html.duckduckgo.com   # primary search backend
    - api.marginalia.nu     # fallback search backend (BF-769)
  audit_enabled: true
  sandbox_enabled: true
  sandbox_default_wall_timeout_seconds: 30.0
  sandbox_default_memory_peak_mb: 256.0
  egress_active_enforcement: false
  credential_tier_enforcement: false
  # AD-1278 (BF-780): the per-execution audit record replaced a consensus gate,
  # so it has to outlive the process. Durable-preferred, not durable-required --
  # a sink that fails degrades the run to an in-memory record that labels
  # itself, rather than refusing to execute.
  audit_persistence_enabled: true
  audit_persistence_filename: audit_log.db
  audit_retention_days: 90
  # AD-1278: memory bound on the in-process chain, not a retention policy. Only
  # sink-confirmed entries are evicted, so with persistence off the list grows
  # past this and logs pressure rather than destroying the only copy.
  audit_max_entries: 10000
  # AD-1278: shutdown's flush budget. Small on purpose -- the whole teardown
  # gets 10s, and a drain that hangs shutdown is the worse defect.
  audit_drain_timeout_s: 2.0
  audit_write_queue_maxsize: 1000

  cache_max_entries: 500
  per_agent_hourly_token_cap: 0
  # 2026-08-08: raised 6 -> 20 as immediate relief for a measured priority
  # inversion. AD-637f classifies a Captain message as Priority.CRITICAL so it
  # gets the reserved interactive slots -- but that classification lives on the
  # NON-agentic path (cognitive_agent.py:3728). With dm_agentic.enabled the
  # Captain's DM runs through AgenticLoop, which has NO priority concept at all
  # (agentic_loop.py:875 calls complete(req) with no priority), so it defaults
  # to NORMAL and lands in the shared background lane of
  # max_concurrent_calls - interactive_reserved_slots = 4.
  #
  # Measured today: 80 agents generating 20-32 proactive/ward-room cognition
  # events per minute all share those 4 slots. For "Are you still there?" the
  # timeline was 12:12:38 agentic dispatch -> 12:12:49 iteration 1 returned a
  # non-empty completion -> 12:12:58 promoted at the 20s budget. So the turn DID
  # get a slot; it waited ~11s for one (a direct probe of the same proxy answers
  # in ~1s), which left under 9s for the tool call iteration 1 requested and no
  # room for iteration 2. An earlier version of this comment claimed the turn
  # was promoted "before making a single LLM call" -- that was wrong, and the
  # 12:12:49 line disproves it. The congestion is real; the mechanism is a slow
  # first slot, not a missing one. The one run that completed (2026-08-07
  # 20:46) started 38s after a cold boot, when the lane was empty.
  #
  # 20 leaves 18 background slots. This is relief, NOT the fix: BF-654's
  # per-endpoint cap (max_inflight_per_endpoint, below) still bounds real
  # transport concurrency, so this only shortens the queue -- it does not give
  # the Captain priority. The fix is to thread priority through AgenticLoop so
  # a Captain turn reaches the interactive lane it was already classified for.
  max_concurrent_calls: 20
  interactive_reserved_slots: 2

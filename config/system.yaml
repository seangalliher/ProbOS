agentic_dispatch:
  enabled: true
  max_parallel_subtasks: 3
  max_convergence_rounds: 2
  orchestrator_enabled: true
  # AD-1142, enabled 2026-07-26. Ships default-OFF.
  # Crew children previously had NO compaction at all -- max_iterations bounds
  # TURNS, not BYTES, so with unbounded tool results one turn can blow the
  # window. Compaction is best-effort: it warns once if still over budget and
  # never raises. Note AD-1142 also fixed a defect where the trigger compared
  # CUMULATIVE SPEND and latched on permanently, firing an extra fast-tier LLM
  # call every remaining iteration; it now reads working-context occupancy.
  crew_compaction_enabled: true
  crew_compaction_threshold_tokens: 60000
  # --- AD-1155 (epic #1068), enabled 2026-07-26. Ships default-OFF. ---
  # Re-invokes a crew child that stopped before finishing. The loop is the
  # OUTERMOST decorator, so each iteration is a complete, independently
  # governed run -- which is why it needs no checkpointing and no suspension.
  #
  # Only max_iterations is re-invokable. token_budget stays terminal (it is a
  # spend ceiling, and overriding it would reverse AD-1142's deliberate mapping
  # to failed) and so does error (usually window exhaustion, where the
  # continuation makes task_text LONGER and re-running is counterproductive).
  #
  # WORST CASE with 2 iterations: 2 x 25 inner x 3 parallel tools = 150 tool
  # invocations per child, before max_parallel_subtasks and convergence rounds.
  # The cap is le=5; raising it multiplies all three.
  crew_loop_until_done_enabled: true
  crew_loop_until_done_max_iterations: 2
  crew_loop_until_done_predicate: stopped_reason
  # The open_todos predicate is deliberately NOT selected: the crew fan-out
  # never writes a checklist (zero .steps references), and _all_steps_done([])
  # returns False -- so a naive todo predicate would re-invoke EVERY child to
  # the cap.
  crew_loop_until_done_completion_marker: TASK COMPLETE
  # crew_token_budget: null
  #   Deliberately left unset. This is a HARD stop -- crossing it FAILS the
  #   child and leaves its dependents blocked, which is different from the
  #   threshold above (that only shrinks history). It was also inert until
  #   BF-680, because the proxy reports zero tokens and the counter never grew;
  #   it now works off a client-side estimate, so setting it would take real
  #   effect for the first time. Choosing a spend ceiling is a policy call.

# Agentic-loop conversation mechanics (epic #1068), enabled 2026-07-26.
# This whole section was absent, so every knob below was at its default.
agentic_loop:
  # AD-1146: send the provider a REAL multi-turn message array --
  # assistant.tool_calls followed by role:"tool" entries keyed by tool_call_id.
  # With this off the loop re-flattens the entire transcript into one user
  # prompt every iteration and returns tool results as untagged user text.
  structured_tool_messages: true

  # AD-1147: run the read-only allowlisted tool calls of one response
  # concurrently. Mutating and unrecognised tools stay sequential -- an unknown
  # tool is assumed unsafe. Results are returned in REQUEST order regardless of
  # completion order, so the assistant turn stays aligned with its replies.
  parallel_tool_calls_enabled: true
  max_parallel_tool_calls: 3

  # AD-1148: bound each tool result before it enters the message history.
  # THIS IS THE ONE WITH REAL EXPOSURE AT ITS DEFAULT. Shipping 0 means
  # unbounded, and max_iterations bounds turns rather than bytes -- so ~24 turns
  # of large tool output blows any context window. 6000 caps the worst case at
  # roughly 24 x 3 x 6000 = 108K tokens, comfortably inside a 200K window, with
  # no compaction LLM calls needed. Head AND tail are preserved (many tools
  # print their header first and their summary last) with a marker reporting
  # how many characters were elided.
  tool_result_max_chars: 6000
  tool_result_head_chars: 4000
  tool_result_tail_chars: 2000

  # AD-1151: durable tool-output trace. Already default-ON; pinned here for
  # visibility. Must stay >= tool_result_max_chars or the audit record would
  # hold less than the model already saw -- the resolver clamps upward to
  # guarantee that, so 8192 wins over the 6000 above.
  tool_trace_output_max_chars: 8192
  tool_trace_max_bytes: 262144

group_chat:
  # AD-925: operator opt-in. With the crew orchestrator enabled (above), when
  # CrewTaskExecutor fans a parent task out to >=2 distinct crew it auto-creates
  # ONE task-linked workspace room (idempotent; AD-918 cooldown/cap apply).
  auto_task_room_enabled: true
  # AD-935: bounded synchronous agent-to-agent reactivity. After the Captain
  # round, an agent reply fans to the OTHER crew for up to max_agent_rounds
  # extra rounds (AD-915 convergence gate + [NO_RESPONSE] + round cap bound it).
  agent_reactivity_enabled: true
  max_agent_rounds: 2
  # BF-614: cap NON-mentioned speakers to one per turn (AD-915 facilitator).
  # Two linked effects: (1) the crew no longer ALL reply at once to every
  # Captain turn - only the most-relevant agent does (an @-mentioned agent is
  # always included); (2) it UNBLOCKS agent-to-agent reactivity - the cascade
  # excludes a round's own speakers, so with everyone speaking in round 0 a
  # 2-agent room had nobody left to react; capping to 1 leaves the other agent
  # free to respond in the next round (Ezri -> Yeo -> Ezri turn-taking). The
  # Pydantic default stays 0 (zero-config boot = AD-914 all-at-once).
  max_speakers_per_turn: 1
  # AD-951: turn-allocation rule 1a - an agent that directly addresses a peer by
  # callsign ("@yeo ..." or "Yeo, ...") selects that peer to speak next (hard-
  # included past the per-turn cap + convergence, still bounded by
  # max_agent_rounds). Makes AD-950's "hand the floor to a named peer" mechanical.
  # The Pydantic default stays False (zero-config boot = AD-935 relevance-ranked).
  agent_next_speaker_selection_enabled: true
  # AD-958a: exploration / anti-rich-get-richer term. A domain-relevant but
  # unproven (low-trust) agent gets a deterministic UCB-style bonus
  # (weight_exploration * department_relevance * (1 - trust)) so it is surfaced
  # to EARN trust instead of high-trust agents monopolising the room (Minimal
  # Authority axiom). 0.15 keeps it meaningful (comparable to department/recency
  # 0.25) but BELOW the mention weight 0.40, so a direct address always wins.
  # Pydantic default 0.0 (off); this enables it for the live system.
  weight_exploration: 0.15
  # AD-970: agent-initiated kickoff. When a crew agent OPENS a group chat with a
  # first message (the AD-924 [GROUP_CHAT] tag), fan that opening out to the
  # other participants so they respond — the agent-initiated analogue of a
  # Captain turn, bounded by the SAME backstops above (cap / convergence /
  # [NO_RESPONSE] / max_agent_rounds). The Pydantic default stays False (a
  # zero-config boot keeps the AD-918 quiet-create behavior); this enables it
  # for the live system so an agent-started room actually starts talking.
  agent_initiated_kickoff_enabled: true
  # AD-1079: when a Ward Room thread becomes a sustained multi-crew exchange,
  # hint a Commander+ participant to convene a dedicated room (the "social
  # spark"). Pydantic default False; enabled here for the live system.
  escalation_suggestion_enabled: true
  # AD-963a: broadcast turn-mode terminator. A Captain turn that is a plural ask
  # to the whole room ("what do you all think?", "everyone, weigh in") lets EACH
  # crew participant answer once (round-robin, relevance-ordered, each seeing
  # prior answers) instead of stopping at max_agent_rounds — so a broadcast is
  # answered completely. A non-broadcast turn (the default classification) is
  # byte-identical to the AD-935/961 discussion cascade. Pydantic default False;
  # enabled here for the live system.
  broadcast_terminator_enabled: true
  # AD-956: scale-aware facilitation. Once a room reaches >= gate_threshold
  # active speakers the facilitator switches from advisory (widen the per-turn
  # cap so everyone is heard, bounded by participant count) to gating (the
  # AD-915 cap stands) so a large room stays legible. Pydantic default False;
  # enabled here for the live system.
  scale_aware_facilitation_enabled: true
  facilitation_gate_threshold: 5
  force_facilitation_min: 0
  # AD-958: conversational trust loop. When a group room GENUINELY converges
  # (the same is_converged primitive the facilitator uses) each corroborated
  # agent earns a SMALL positive trust outcome, topic-tagged and verified by a
  # DIFFERENT agent (no self-sourcing), via the synchronous record_outcome.
  # Bounded (<= max_outcomes x small weight). Pydantic default False; enabled
  # here for the live system.
  conversation_trust_enabled: true

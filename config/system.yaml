# AD-992+ governed code execution (HIGH-RISK). Lets crew agents create + run
# Python scripts and install libraries to perform tasks, consensus-gated +
# episodically logged. Each agent gets its own PERSISTENT working folder under
# workspace_root (relative paths rebase onto the platform data dir, i.e.
# %LOCALAPPDATA%/ProbOS/data on Windows), viewable from its profile Work tab.
# Tier 1 = subprocess + working-folder isolation (NOT kernel containment); the
# consensus gate is the real control. Disable allow_package_install for
# script-execution-only (no arbitrary pip installs).
execution:
  enabled: true
  workspace_root: data/execution/workspaces
  persistent_workspaces: true
  allow_package_install: true
  # AD-1074d: stage the thread's current documents into the sandbox so an agent
  # can read + edit an existing file (the Cowork round-trip). Only changed/new
  # files are re-versioned.
  stage_thread_artifacts: true
  # AD-1221: let sandboxed code fetch a URL through the ship's governed HTTP
  # path — `import ship; r = ship.fetch(url)`. This is NOT general network
  # access: the sandbox gets a loopback socket to a relay that exists only for
  # that one run, and every request still passes SSRF validation, per-domain
  # rate limiting and audit. It exists so an agent can fetch a large document
  # and extract the answer IN ONE PROCESS, instead of carrying every byte
  # through its context window (Design Principle 13).
  fetch_broker_enabled: true
# AD-1220: ask-before-install for the sandbox. When a script imports a library
# the environment does not have, the agent files an `install` capability
# request and it appears in the Bridge approval queue; approving it installs
# into the environment the sandbox shares, so the next run can import it.
# `prompt_unlisted` is the load-bearing choice: allowlisted imports
# (self_mod.allowed_imports, stdlib) auto-approve, everything else asks the
# Captain. `whitelist` would silently ignore every unlisted request, which is
# the dead behaviour AD-1220 was written to end.
dependency:
  dynamic_install_enabled: true
  dynamic_install_policy: prompt_unlisted
  dynamic_install_deny: []
# AD-1065: conversational agentic loop. When enabled, a 1:1 DM runs the
# tool-calling loop so an agent can use run_python (AD-1066) to create REAL
# documents (.docx via python-docx, .xlsx, .pdf) mid-chat instead of the
# AD-1064 <artifact> markdown fallback. Requires execution.enabled (above).
dm_agentic:
  enabled: true
  # BF-692/BF-697 (2026-07-29): raised 5 -> 10. At 5 the observed trace for
  # "type into the document I have open" was state, screenshot, click, click,
  # click -- the budget was exhausted before key_type was reached. Even with
  # BF-692's real element discovery, the natural sequence (state -> click ->
  # key_type -> screenshot -> verify) is exactly 5 with no room for a retry or a
  # misstep. AD-1164 (below) is the structural fix; 10 stays because a wider
  # first pass is still the cheapest way to finish inside one turn.
  #
  # BF-700 (2026-07-31): raised 10 -> 20, then PUT BACK to 10 the same night.
  # The 20 was a misdiagnosis, and the trace says so plainly. The turn really
  # did end on "I can see the document content area at index 90/91, let me
  # click on it", which reads like a budget problem -- but the persisted tool
  # trace showed the agent had ALREADY clicked the surface successfully on
  # step 2 and then been told "unknown browser action: 'key_type'" for the one
  # verb that types into a focused element. Steps 3-20 were flailing at a
  # missing primitive, not work. BF-701 restored the verb.
  #
  # Doubling the budget more than doubled the cost (219k -> 475k tokens) and
  # made the outcome WORSE: the AgenticLoop re-flattens the whole message
  # history into one prompt every iteration, and no compactor is wired into
  # the conversational path, so each extra step re-pays for every step before
  # it. At 475k the early state() result -- the one that found the document --
  # was buried, and the agent talked itself back into "canvas-based, use
  # coordinates". More room to flail is not more capability.
  #
  # 10 stands until compaction is wired into this path. Raise it then, on
  # evidence, not before.
  #
  # 2026-08-04: the condition above is MET. AD-1167 wired compaction into this
  # exact path — cognitive_agent.py:3879 gates on compaction_enabled and :3898
  # passes the compactor into the loop — and compaction_enabled is true below.
  # The quadratic re-flattening that made 20 worse than 10 is what compaction
  # removes, so the reason for the cap no longer holds.
  #
  # Raised 10 -> 25 to make multi-step work completable. Measured motivation: a
  # 15-item fetch task could not finish in 10 iterations, exhausted its passes,
  # filed a continue request, and stranded (AD-1204). 25 is chosen to clear that
  # class of task with headroom, not as a ceiling on principle.
  #
  # This is still "on evidence, not before" — the evidence being that the
  # prerequisite shipped. Re-measure token cost on the same task and record it
  # here; if cost grows superlinearly again, compaction is not engaging and the
  # number goes back to 10 until it does.
  #
  # VERIFIED LIVE 2026-08-07 (#1163). Temporarily dropped to 5 to force the
  # exhaustion the AD-1204 resume needs, since at 25 the tasks that used to
  # strand now finish. The chain fired end to end for the first time:
  #   12:19:05  AD-1204  work item d4eb065557e7 parked blocked on 70fff82e
  #   12:19:29  AD-1211  approved continue request fulfilled
  #   12:19:29  AD-855   work item resumed and re-dispatched
  # Restored to 25 immediately afterwards. Note what 5 cost: the agent could
  # not make 15 http_fetch calls in 5 iterations, so it answered from training
  # data and said so. A step budget below the task's tool-call count does not
  # slow the work down, it changes what the work IS.
  max_iterations: 25
  tier: standard
  # AD-1167 (2026-07-31): compaction ON for this instance. The measurement that
  # motivated it was taken here: 218,957 -> 474,736 tokens when max_iterations
  # went 10 -> 20, with a WORSE answer at the higher budget. Compaction is the
  # prerequisite for ever raising that cap again.
  compaction_enabled: true
  compaction_threshold_tokens: 60000
  # AD-1164 (2026-07-29): the step limit becomes a checkpoint that asks instead
  # of a cliff that truncates. On exhausting max_iterations the turn either
  # re-invokes (only while a live AD-1154 standing rule for
  # dm_agentic.continue -- nothing issues one yet, so today this branch is
  # dormant) or files a kind="continue" request into the approval inbox and
  # returns the partial work saying plainly that it stopped mid-task.
  # Worst case here: 2 passes x 10 iterations x 3 parallel tool calls = 60 tool
  # invocations for one chat turn -- and the second pass needs a standing rule
  # the Captain has not issued, so the real ceiling today is 30.
  continue_or_ask_enabled: true
  continue_or_ask_max_passes: 2
  # AD-1165 (2026-07-30): a turn that outgrows a reply becomes a background
  # task instead of being cancelled by the 60s chat TTL. Past this budget the
  # run is NOT cancelled -- the same in-flight loop keeps going, a work item is
  # opened for it, the turn returns an acknowledgement inside the TTL, and the
  # result is posted back into this thread when it lands.
  # 35 is chosen against the numbers above: ~9s/iteration x max_iterations 10
  # is ~90s, which never fit in 60. At 35s roughly four iterations have run and
  # 25s of TTL remain for the promotion itself. A conversational turn with one
  # or two tool calls finishes well inside 35s and is untouched.
  # CORRECTION 2026-07-31: an earlier comment here blamed a 30s NATS deadline.
  # That was wrong. NatsConfig has no request_timeout_seconds -- that field is
  # on MCPConfig -- and IntentBus uses timeout=intent.ttl_seconds on BOTH the
  # NATS and local branches, so the deadline is 60s either way.
  #
  # The real problem is that this budget and the TTL are measured from
  # DIFFERENT origins. The TTL starts when the DM is dispatched; this budget
  # starts when run_with_promotion is reached, far inside the handler. The
  # preamble between them -- perceive, sensorium, episodic recall, session
  # binding, and contention with background cognition -- is unbudgeted.
  # Observed 2026-07-31: dispatch 21:39:00, agentic turn started 21:39:29 (a
  # 29s preamble, concurrent with a dream cycle), ack at 21:40:04 against a
  # TTL that expired at 21:40:00. The governing invariant is
  #   preamble + promote_to_task_after_seconds < ttl_seconds.
  #
  # 20 only shrinks the window; a slow enough preamble still overruns it.
  # BF-705 is the real fix: IntentMessage already carries ttl_seconds and
  # created_at, so propagate them into the observation and promote at
  # min(configured, remaining - margin) instead of a fixed budget.
  #
  # 2026-08-08: BF-705 SHIPPED, so the clamp now protects the TTL and this
  # value no longer has to be defensive -- it was left at the emergency 20 and
  # is now the thing doing harm. Measured on this vessel today: EVERY promotion
  # logs "after 20.0s measured (budget 20.0s)", i.e. nothing ran long, the
  # guillotine simply fell. One loop iteration costs ~6s under current ward-room
  # load (11:55:47 dispatch -> 11:55:53 iteration 1), so 20s buys 2-3 of the 25
  # iterations max_iterations allows. The Captain asked "Any update?" -- a
  # one-iteration question -- and it was promoted to a background task, because
  # iteration 2 was still in flight when the budget expired.
  #
  # 40 lets a simple turn finish inline (~2 extra iterations) while staying
  # inside the 60s DM TTL via the BF-705 clamp min(configured, remaining-margin).
  # It deliberately does NOT try to fit the genuinely long work: the top-15-PyPI
  # task measured 301,838 tokens over ~130s on 2026-08-07, which no budget
  # inside a 60s TTL can hold. That one SHOULD promote -- the open defect is
  # that the promoted run then never reports back, which is not this knob.
  promote_to_task_after_seconds: 40

  # AD-1230 (2026-08-10): hold a Captain DM the LLM was too degraded to answer
  # and reply in the same thread once the model recovers. Turned on here because
  # the condition it covers is routine and short -- the live reference case
  # showed all five tiers cooling with 5s remaining, and BF-674 clocked a 48.8s
  # proxy window. Before this, that turn was spent: BF-714 told the Captain
  # honestly to send it again, which is correct behaviour for a promise the
  # runtime could not keep, and unnecessary work for one it can.
  #
  # Only turns whose degrade the runtime could actually diagnose are held. An
  # unreadable health status keeps the BF-714 resend wording, because a promise
  # to retry needs evidence that a retry would land differently.
  hold_degraded_turns: true
# AD-1072: conversational-loop discovery + delegation tools. search_capabilities
# lets an agent find what tools / skills / mesh-intents exist before using them
# (read-only). delegate_task hands a bounded subtask to another crew agent BY
# CALLSIGN and returns its result, routed through the same governed
# WorkItemAgenticExecutor (depth-guarded against runaway fan-out). Both run
# inside the AD-1065 loop above (require dm_agentic.enabled, set above).
# AD-1172 (2026-07-31): a reported fault can reach a repair harness. Enabled on
# this instance at the Captain's direction. The dispatcher only ever PROPOSES:
# when a fault has recurred twice it files ONE approval carrying a
# harness-neutral repair brief, and nothing is spent or written until the
# Captain approves it and picks a target. Expect these in the approval inbox.
#
# `targets` is the list of harnesses offered. `architect` is the internal crew
# (ArchitectAgent then BuilderAgent). Any other name is an external harness --
# GitHub Copilot, Claude Code, a person -- reached by rendering the brief for
# the Captain to carry across; external targets need no code, because the brief
# IS the interface.
repair:
  enabled: true
  targets:
    - architect
    - copilot
  propose_after_occurrences: 2

agentic_tools:
  tool_search_enabled: true
  delegation_enabled: true
  delegation_max_depth: 1
  delegation_max_iterations: 5
  delegation_tier: standard
  # --- Sigma epic (#1057), enabled 2026-07-26. All ship default-OFF. ---
  # AD-1139: agents can READ the shared commons mid-task via the oracle_query
  # tool. Sigma tiers only, never the sovereign episodic shard. Framing is
  # carried inline so results arrive explained rather than just appearing.
  oracle_query_enabled: true
  # AD-1140: agents can WRITE findings back. There is no consensus gate on this
  # path -- the bounds below ARE the control. Publish is additive and
  # git-reversible, so the risk is volume, not irreversibility.
  publish_finding_enabled: true
  publish_finding_max_per_hour: 12          # per author
  publish_finding_max_per_hour_ship: 40     # ship-wide; bounds RATE, not the
                                            # 72h dedup-window population
  publish_finding_max_content_chars: 4000   # == _RECORD_DOC_CHARS, so what you
                                            # publish is what is discoverable
  # AD-1141: the crew loop consults the commons before working and is nudged to
  # publish after. A consult that finds nothing above min_score injects ZERO
  # characters -- no header, no "commons was silent" note.
  crew_sigma_context_enabled: true
  crew_sigma_max_chars: 2000                # total injected per child
  crew_sigma_max_entries: 4
  crew_sigma_min_score: 0.35                # NOTE: a volume control, not a
                                            # principled relevance threshold --
                                            # Oracle tier scores are not
                                            # normalised against each other
  # --- AD-1153 (epic #1068), enabled 2026-07-26. Ships default-OFF. ---
  # Offers the browser tool inside the agentic loop. Before this, BrowserTool
  # was registered in the ToolRegistry but no agent could reach it -- there was
  # no browser block in the offered tool_ids, so agents fell back to http_fetch
  # or confabulated a verb.
  #
  # READ-ONLY: goto, state, extract_text, back, forward, wait. click/type/scroll
  # are deliberately excluded and wait on the approval inbox below. The reason
  # is specific: classify_action returns tier 2 for goto UNCONDITIONALLY before
  # any URL inspection, destructive_url_patterns has zero readers on the tool
  # path, and the tier-3 confirmation returns a SUCCESS-SHAPED no-op that a
  # model reads as success and retries. The six offered actions never reach
  # tier 3, so that broken gate is never consulted.
  browser_enabled: true

  # --- AD-1180, enabled 2026-08-01. Ships default-OFF. ---
  # Composes the shared agentic disposition into the system prompt inside
  # WorkItemAgenticExecutor.run, so it reaches EVERY path that hands an agent a
  # tool array -- not just the Captain's 1:1 DM turn.
  #
  # AD-1177 authored that disposition (be resourceful, run_python is the
  # general-purpose instrument, the tool array is authoritative, act inside your
  # orders) and it reached exactly ONE of five callers. The other four -- the
  # AD-856 task path, crew children, the AD-860 convergence re-run and AD-1072
  # delegation -- pass the agent's STATIC instructions attribute straight
  # through while receiving the same eleven-group tool array. They held every
  # tool and were told nothing about using them.
  #
  # Turning this ON is a REAL behaviour change for crew children, verifier
  # convergence and delegated sub-agents, by design: roughly 1,500 characters of
  # disposition now precede their task. That is the point -- emergence and
  # collaboration live in those paths, and they were the ones running blind.
  #
  # Budget note: crew_token_budget (AD-1142) is a HARD STOP that fails a child
  # and blocks its dependents. It is unset here, so there is no ceiling for
  # these characters to push a child over. If you ever set one, re-check this.
  disposition_enabled: true

approval_inbox:
  # --- AD-1154 (epic #1068), enabled 2026-07-26. Ships default-OFF. ---
  # Parks an unattended agent's consequential asks as a durable
  # CapabilityRequest (kind="action") instead of acting or silently no-opping.
  # Lands in the existing AD-853/855/857 surface -- the HXI capability-request
  # panel and the Captain-DM notifier -- so it is somewhere with existing eyes
  # rather than a new inbox nobody reads.
  #
  # IMPORTANT: approval is a DECISION, not a replay. The browser session is
  # capped at 1800s against human latency, and replaying a page-relative
  # selector against a changed page is a different act from the one approved.
  # So approving a parked ask does NOT execute it. What it buys is a durable
  # audit trail, a trust signal, and a standing rule that unblocks the NEXT run.
  enabled: true

  # The "don't ask again" lever, kept on a SEPARATE flag so the audit trail can
  # be taken without the durable privilege. A standing rule converts "approved
  # once" into "may do this shape of thing, in this scope, unattended" -- the
  # TTL is enforced in the schema (NOT NULL) and there is no wildcard scope.
  standing_rules_enabled: true
  standing_rule_default_ttl_hours: 24
  standing_rule_max_ttl_hours: 168
  max_pending_per_agent: 20
  pending_ask_ttl_hours: 72


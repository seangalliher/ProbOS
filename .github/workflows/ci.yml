name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    # BF-322: bumped 15 -> 30. Waves 175-180 added ~150 tests + heavier
    # fixture surface (perception pipeline, AD-742f WM persistence, AD-746
    # aggregator, AD-747 conversation controller). With BF-320's per-test
    # 180s allowance, the cumulative suite needs 18-22 min on GHA runners.
    # 30 min gives a 10-min safety margin without masking real regressions.
    # BF-657: bumped 30 -> 45. The embedding crash previously bailed the suite
    # early (--maxfail); with CI now running the FULL suite green, and xdist
    # reduced from -n 16 to -n auto (matched to the runner cores to kill the
    # oversubscription timing flakes), the full run needs more wall-clock.
    timeout-minutes: 45

    env:
      # BF-657: force the network-free local embedding fallback so ChromaDB
      # collections never trigger Chroma's downloaded default ONNX EF (CI has
      # no onnx cache and cannot download). Production stays on real embeddings.
      PROBOS_EMBEDDINGS: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        # BF-657: install the discovery (zeroconf) + browser (playwright pkg,
        # no browsers) extras so the AD-708e mDNS + AD-1052b browser-bridge
        # tests run instead of failing on the missing optional import.
        run: uv sync --group dev --extra discovery --extra browser

      - name: Run tests
        # BF-322: dropped -x (fail-fast). Per user-memory rule, -x with xdist
        # kills the whole gate on any single artifact/flake. Use --maxfail=10
        # to still bail on real regressions while tolerating documented
        # flakes (test_dreaming::test_nl_to_dream_cycle_changes_weights,
        # test_ward_room sort isolation flake).
        # BF-657: -n auto (was the pyproject default -n 16). 16 workers on a
        # 4-vCPU runner is 4x oversubscription -> asyncio teardown races
        # ("Event loop is closed") + timing-test flakes (bf304 single-flight,
        # ad1032 arousal decay). -n auto matches workers to cores.
        run: uv run pytest tests/ -n auto --maxfail=10 -q --tb=short

  ui-tests:
    runs-on: ubuntu-latest
    # BF-322: bumped 10 -> 15. AD-733c-7 / AD-705a / AD-747 / AD-746
    # added 79 vitest tests + heavier setup (onnxruntime-web mocks, larger
    # 3D / canvas fixtures). 15 min gives margin without masking real
    # regressions.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Run tests
        working-directory: ui
        run: npm run test

      - name: Type check & build
        working-directory: ui
        run: npm run build

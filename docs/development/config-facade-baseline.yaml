# AD-1270e1 configuration facade contract: the public surface of
# probos.config -- names, tiers, model identity, field order, defaults,
# aliases and schema digests -- frozen before AD-1270e2/e3 move any model.
#
# Regenerate with:
#   python scripts/check_config_facade.py --update-baseline
#
# Read before editing:
#   * `fields` is DECLARATION order. --check re-proves that model_dump()
#     order and schema `properties` order still derive from it; a
#     divergence is a Pydantic behaviour change, not a regeneration.
#   * `schema_sha256` is a digest, not a dump. Defaults, order and aliases
#     are explicit dimensions above it; the digest catches type and
#     constraint changes only. Do not expand it into a full schema.
#   * Defaults come from model_fields, never from model_json_schema(),
#     which silently drops the three Path-valued defaults.
#   * Path values are POSIX-normalised. A raw dump is Windows-only and
#     goes red on Linux CI while --check passes locally.
#   * `tier: owned` is the contract. `tier: incidental` names are import
#     leakage recorded so nothing is invisible; removing one is a
#     reviewable diff, not a contract break.
#   * A re-export keeps qualname/bases/fields and passes, provided the
#     model moved into src/probos/config_models/ -- the same directory G2
#     scans for environment reads. A wrapper or subclass changes `bases`;
#     a partial clone changes `fields`.
#   * The `environment` rows are captured in a scrubbed subprocess. Adding
#     an environment read without a row here fails on day one.
#   * Written with the platform's default line endings, like every other
#     generated doc here, so a Windows working tree holds CRLF and the
#     index holds LF. Nothing compares these bytes -- both the checker and
#     its tests compare the parsed document -- but a raw read_bytes()
#     probe must fold newlines before hashing or it will disagree with
#     `git show :<path>` on Windows and agree on Linux.
# A blank review.owner/rationale/review_by fails --check on purpose.
schema_version: 1
baseline_id: ad-1270e1-config-facade-v1
epic: 1324
review:
  owner: AD-1270e1
  rationale: AD-1270e2/e3 move 224 models out of a 304-name module that 703 tracked files import. Freezing imports, defaults, aliases, schema digests and field order first means an extraction that changes behaviour shows up as a data diff on the exact symbol, not as a large mechanical rename nobody can read. The five dimensions are one document because a reviewer comparing a moved model wants one place to look, and because a per-domain split would pre-commit the domain boundary e2 is supposed to decide.
  review_by: AD-1270e3 has landed the thin permanent facade and every incidental row is gone, or a domain partition exists and this file has been split to match it.
handoff_to_e2:
- Widen check_config_profiles._DEFAULT_CONFIG_MODULE from a single file to the config_models package. Its real->declared environment gate scans one path and goes blind the moment models move; the config-facade checker fails the day the directory appears so this cannot be forgotten.
- Add a select_tests.BLAST_RADIUS_PATTERNS entry covering src/probos/config_models/*. src/probos/config.py is a blast-radius entry today; a moved model must keep selecting the full suite. Add it in the same commit that creates the directory -- changing the selector invalidates selector claims about that same tree, so it cannot be done here in advance.
- Re-export moved models from probos.config, and move them into src/probos/config_models/. Identity is compared by qualname, MRO bases and ordered fields, never by __module__, so a re-export passes and a wrapper, subclass or partial clone fails. Ownership -- the owned/incidental tier -- does read __module__, and accepts probos.config or that one package, because it is the same directory G2 scans for environment reads. A move anywhere else fails here rather than silently keeping the tier while the environment scan goes blind.
- 'Regenerating this baseline is expected during e2/e3. Regenerating it to make a failure go away is not: every row here is a behaviour a consumer already depends on.'

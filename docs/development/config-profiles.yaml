# AD-1185 config profile contract: which default-OFF flags are classified,
# what may arm them, how they depend on and conflict with each other, and
# which environment reads make a config resolve differently in CI.
#
# Regenerate the frozen row set with:
#   python scripts/check_config_profiles.py --update-baseline
# A blank review.owner/rationale/review_by fails --check on purpose.
# Classifying a flag means DELETING its row from unclassified_flags in the
# same commit that adds its entry to flags.
schema_version: 1
baseline_id: ad-1185-config-profiles-v1
tracking_issue: 1121
smoke_test_node_id: tests/test_ad1185_config_profiles.py::test_supported_profile_boots_and_reads_a_file
census:
  measured_at_commit: c5a63b03
  instrument: scripts/check_config_profiles.py default_false_flags() -- walks the nested Pydantic
    model tree from SystemConfig, each model type visited once per path, cycle-guarded. Armed
    counts compare against config/system.yaml loaded through load_config.
  boolean_fields_reachable: 427
  default_false: 202
  default_true: 225
  default_false_armed_by_system_yaml: 84
  default_false_never_armed: 118
  unattributable_deltas:
  - measure: default-OFF boolean count
    this_manifest: 202
    issue_1121_2026_08_03: 199
    finding: 'Both figures are internally consistent (80+119=199 there, 84+118=202 here).
      #1121''s instrument is not recorded, and its ''armed locally'' may mean the reference
      vessel''s own config rather than the tracked config/system.yaml. The delta is therefore
      UNATTRIBUTABLE, not a measured +3 growth. Neither number is adopted as the other''s
      correction.'
  - measure: security_infra.* default-OFF count
    this_manifest: 2
    issue_1121_2026_08_03: 3
    finding: 'Enumerated on the live model: audit_enabled(T), audit_persistence_enabled(T),
      credential_tier_enforcement(F), egress_active_enforcement(F), egress_deny_by_default(T),
      egress_enabled(T), sandbox_enabled(T), secrets_persistence_enabled(T). Two are default-OFF
      today. AD-1278 (BF-780) flipped audit_persistence_enabled ON, which is a plausible but
      UNVERIFIED explanation for the third; recorded as a discrepancy rather than resolved.'
  - measure: environment-dependent defaults on SystemConfig
    this_manifest: 2
    issue_1121_2026_08_03: 1
    finding: '#1121 and the AD-1185 build prompt both record NatsConfig.enabled as the only
      environment-dependent default, on the grounds that it is the sole field carrying validate_default=True.
      Measured 2026-09-02, that criterion is wrong: CognitiveConfig._apply_env_overrides is
      a @model_validator(mode=''after''), which ignores validate_default and runs on every
      construction, so PROBOS_LLM_URL moves the SystemConfig() dump from sha 8246174c4f0c9cbe
      to 157cd9fac26d6147. This delta IS attributable -- the older instrument is recorded
      and can be shown to be unsound -- so it is corrected here rather than only noted, and
      the checker keys the real->declared direction on validator KIND instead.'
admission_rules:
  profile: supported
  version: 1
  rules:
  - A manifest row whose kind is product-feature or security-control.
  - A non-empty evidence_to_promote naming an EXISTING test node that proves the flag changes
    behaviour when armed. A test asserting only that the default is False proves the default,
    not the feature, and does not qualify.
  - The profile still boots with no network and no external service, proven by the smoke at
    smoke_test_node_id.
  - No requires / conflicts_with breach.
  excluded_by_rule_3:
    kind: optional-integration
    reason: A flag whose absence blocks boot cannot sit in a profile whose acceptance is an
      offline CI boot. config/system.yaml arms nats.enabled, channels.discord.enabled, execution.enabled
      and browser_tool.enabled; copying it would yield a supported profile whose smoke needs
      a live NATS server.
    promotion: An optional-integration flag becomes admissible once its row declares a degrades_to
      behaviour for the dependency being absent AND a test proves that degraded path.
  resulting_supported_flag_count: 4
promotion:
  conflicts_to_root_validator:
    current: 'Conflicts fail in the profile loader: probos.config_profiles.load_profile raises
      ProfileConflictError before returning a SystemConfig, and the checker proves no declared
      rule fires against SystemConfig(), config/system.yaml, config/node-1.yaml or config/node-2.yaml.'
    deferred: A model_validator(mode='after') on SystemConfig fires for EVERY construction
      -- every test module, all three tracked YAMLs, every commercial-overlay import and every
      untracked operator config in the field. A previously-working config would begin refusing
      to boot, and AD-1270e1 is freezing the config root's contract in this same wave.
    promote_when: (i) the checker has shown zero declared conflicts firing across all four
      configs for a sustained period, and (ii) AD-1270e1's golden parity has shipped so a
      validator addition can be proven not to alter the frozen dump.
review:
  owner: AD-1185
  rationale: '202 default-OFF booleans cannot be triaged in one slice, and pretending otherwise
    would produce ~170 rows of invented rationale. The flags in flags: are the ones actually
    read during AD-1185 -- every profile-armed flag, the two groups #1121 names by count (federation.*,
    security.memory.enforce_*), the six it names individually, the security_infra.* pair behind
    the count discrepancy, and one worked instance of each of the six kinds so the taxonomy
    is exercised rather than described. The rest are frozen below. The frozen rows carry no
    per-row rationale because every row means the same thing; a field that is always the same
    sentence stops being read. The property this buys is the one AD-1256 bought -- a NEW default-OFF
    flag lands in neither list and fails on day one, and the backlog is visible and frozen
    rather than grandfathered as compliant.'
  review_by: This list is empty, or every remaining flag has a classification.

ci_divergences:
- id: nats-forced-off-in-tests
  mechanism: config-field-validator
  env_var: PROBOS_NATS_ENABLED
  set_by: tests/conftest.py
  set_to: 'false'
  config_path: nats.enabled
  production_resolution: 'config/system.yaml:2259 sets nats.enabled: true, and NatsConfig.enabled
    carries validate_default=True, so with the variable unset production resolves ON while
    the suite resolves OFF.'
  rationale: BF-245 -- a real NATS connection in every test module is a shared external dependency.
    AD-1185 does not remove this divergence; declaring and checking it is the deliverable.
  side_effect: conftest's forced value happens to equal the model default, so a naive minimal
    byte-identity test would pass for the wrong reason. The test deletes the variable instead.
- id: llm-endpoint-env-override
  mechanism: model-validator
  env_var: PROBOS_LLM_URL
  set_by: null
  set_to: null
  config_path: cognitive.llm_base_url
  production_resolution: 'CognitiveConfig._apply_env_overrides is a @model_validator(mode=''after''),
    so it runs on EVERY construction including SystemConfig(). With the variable set, the
    default config''s llm_base_url becomes its value. Measured 2026-09-02: the canonicalised
    SystemConfig() dump moves from sha 8246174c4f0c9cbe to 157cd9fac26d6147 when PROBOS_LLM_URL
    is set.'
  rationale: 'Declared because it is an environment-dependent DEFAULT, not because CI sets
    it -- nothing in tests/conftest.py does, which is arguably worse: no test pins it, so
    a developer or container exporting PROBOS_LLM_URL silently resolves a different default
    config from CI. Found by testing the prompt''s claim that NatsConfig.enabled is the only
    such default rather than adopting it.'
  side_effect: The minimal byte-identity test deletes this variable alongside PROBOS_NATS_ENABLED.
    Identity would in fact survive either being set, because both sides of the comparison
    move together -- which is exactly why the paired test, and not a hard-coded hash, is the
    honest assertion.
- id: hugging-face-forced-offline-in-tests
  mechanism: third-party-env
  env_var: HF_HUB_OFFLINE
  set_by: tests/conftest.py
  set_to: '1'
  config_path: null
  production_resolution: Nothing in ProbOS reads this variable, so production resolves ONLINE
    because nothing sets it. huggingface_hub reads it directly.
  rationale: 'Enumerated 2026-09-02: rg ''HF_HUB_OFFLINE|TRANSFORMERS_OFFLINE'' src/ scripts/
    returns no matches. The mechanism is entirely outside SystemConfig, so config_path is
    null and no profile can control it. Measured during AD-1185: a standalone supported-profile
    boot with the variable unset contacted the HF Hub; the same boot inside the suite does
    not.'
  side_effect: null

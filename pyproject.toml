[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probos"
version = "0.1.0"
description = "Probabilistic agent-native OS runtime"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Sean Galliher" },
]
readme = "README.md"
keywords = ["ai", "agents", "cognitive-mesh", "autonomous", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.19",
    "rich>=13.0",
    "httpx>=0.27",
    "pyzmq>=27.1.0",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "importlib-metadata<8; python_version>='3.12'",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-dotenv>=1.0",
    "croniter>=1.3",
    "nats-py>=2.9",
]

[project.urls]
Homepage = "https://github.com/seangalliher/ProbOS"
Documentation = "https://github.com/seangalliher/ProbOS/blob/main/docs/quickstart.md"
Repository = "https://github.com/seangalliher/ProbOS"
Issues = "https://github.com/seangalliher/ProbOS/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
]
discord = [
    "discord.py>=2.0",
    "aiohttp>=3.9,<3.13",   # discord.py 2.x incompatible with aiohttp 3.13+ (ClientWebSocketResponse removed)
]
slack = [
    "slack-sdk>=3.21,<4",
]
copilot = [
    "github-copilot-sdk>=0.1.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
]

[project.scripts]
probos = "probos.__main__:main"

# AD-697: Commercial overlay extension-point group. Reserved for any
# private a third-party overlay (and any future third-party
# extensions) to register against. The OSS package itself ships zero
# entry points here — discovery is no-op until an overlay is installed.
[project.entry-points."probos.extensions"]
# (intentionally empty)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 90
# BF #466: cap xdist at 16 workers and use loadfile distribution. Heavy-fixture
# files (test_runtime.py, test_dreaming.py, test_distribution.py, etc.) crash
# workers under -n auto when fixtures concurrently boot ChromaDB/SQLite. The
# 16-worker ceiling + loadfile (one file per worker) is the documented stable
# config. Maintainers can override with `-o addopts=-n auto` for a fast local run.
addopts = "-n 16 --dist=loadfile"
markers = [
    "live_llm: tests requiring live LLM backends (Ollama/Copilot proxy)",
    "slow: tests with real wall-clock waits (deselect with -m 'not slow')",
    "heavy_fixture: tests with expensive setup that should run isolated (BF #466)",
]

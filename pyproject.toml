[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probos"
version = "0.1.0"
description = "Probabilistic agent-native OS runtime"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Sean Galliher" },
]
readme = "README.md"
keywords = ["ai", "agents", "cognitive-mesh", "autonomous", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.19",
    "rich>=13.0",
    "httpx>=0.27",
    "pyzmq>=27.1.0",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    # BF-313: torch >=2.4 required by transformers >=4.46 (the version
    # pulled in transitively by sentence-transformers + facenet-pytorch).
    # Wave 174 Builder installed facenet-pytorch with --no-deps to dodge
    # a runtime file-lock on _C.pyd, which left torch 2.2.2 from a wheel
    # restore -- breaking transformers ABI and ALL episodic recall
    # (transformers/integrations/accelerate.py uses nn.Module before
    # importing nn in <2.4 path). Explicit pin so `uv sync` always
    # lands a compatible torch.
    "torch>=2.4",
    "importlib-metadata<8; python_version>='3.12'",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "croniter>=1.3",
    "nats-py>=2.9",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "cryptography>=42",
    "facenet-pytorch>=2.5",  # AD-742b: face-embedding identity (MIT)
    "keyring>=25.0",  # AD-749: M365 token storage (MIT)
    "msal>=1.0",  # AD-749: Microsoft OAuth device-code flow (MIT)
]

[project.urls]
Homepage = "https://github.com/seangalliher/ProbOS"
Documentation = "https://github.com/seangalliher/ProbOS/blob/main/docs/quickstart.md"
Repository = "https://github.com/seangalliher/ProbOS"
Issues = "https://github.com/seangalliher/ProbOS/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
]
discord = [
    "discord.py>=2.0",
    "aiohttp>=3.9,<3.13",   # discord.py 2.x incompatible with aiohttp 3.13+ (ClientWebSocketResponse removed)
]
slack = [
    "slack-sdk>=3.21,<4",
]
copilot = [
    "github-copilot-sdk>=0.1.30",
]
browser = [
    "playwright>=1.50",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
]

[project.scripts]
probos = "probos.__main__:main"

# AD-697: Commercial overlay extension-point group. Reserved for any
# private a third-party overlay (and any future third-party
# extensions) to register against. The OSS package itself ships zero
# entry points here — discovery is no-op until an overlay is installed.
[project.entry-points."probos.extensions"]
# (intentionally empty)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# BF-320: bumped 90s -> 180s. GitHub Actions runners are ~2-3x slower than a
# typical dev box on heavy-fixture tests (full runtime boot + ChromaDB +
# SQLite + multi-pool agent registry). The 90s cap was tight enough that 5
# integration tests timed out in CI while passing in 8-12s locally
# (TestReflectHardeningExtended, TestRuntimeIntegration, TestTrustIntegration,
# TestRuntimeSelfMod, TestEpisodicMemorySeed). 180s gives 2x headroom for the
# slowest fixture without masking real hangs.
timeout = 180
# BF #466: cap xdist at 16 workers and use loadfile distribution. Heavy-fixture
# files (test_runtime.py, test_dreaming.py, test_distribution.py, etc.) crash
# workers under -n auto when fixtures concurrently boot ChromaDB/SQLite. The
# 16-worker ceiling + loadfile (one file per worker) is the documented stable
# config. Maintainers can override with `-o addopts=-n auto` for a fast local run.
addopts = "-n 16 --dist=loadfile"
markers = [
    "live_llm: tests requiring live LLM backends (Ollama/Copilot proxy)",
    "slow: tests with real wall-clock waits (deselect with -m 'not slow')",
    "heavy_fixture: tests with expensive setup that should run isolated (BF #466)",
]
